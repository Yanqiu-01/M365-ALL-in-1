<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>M365 Copilot2API</title><meta name="color-scheme" content="light dark"><style>
:root{color-scheme:light dark;--bg:#f5f5f7;--surface:rgba(255,255,255,0.72);--surface-solid:#fff;--surface-border:rgba(255,255,255,0.5);--line:rgba(0,0,0,0.08);--text:#1d1d1f;--muted:#86868b;--primary:#1d1d1f;--primary-hover:#000;--accent:#0071e3;--red:#ff3b30;--green:#34c759;--shadow:0 8px 40px rgba(0,0,0,0.08);--shadow-lg:0 24px 60px rgba(0,0,0,0.12);--radius:14px;--radius-sm:8px;--ease-out:cubic-bezier(0.23,1,0.32,1);--ease-in-out:cubic-bezier(0.77,0,0.175,1);--font-sans:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB","Noto Sans SC","Source Han Sans SC",system-ui,"Helvetica Neue",Arial,sans-serif;--focus-color:#0062c4;--focus-ring:0 0 0 3px rgba(0,113,227,0.35);--muted-strong:#6e6e73}
@media(prefers-color-scheme:dark){:root{--bg:#1c1c1e;--surface:rgba(44,44,46,0.8);--surface-solid:#2c2c2e;--surface-border:rgba(255,255,255,0.08);--line:rgba(255,255,255,0.1);--text:#f5f5f7;--muted:#98989d;--primary:#f5f5f7;--primary-hover:#fff;--accent:#0a84ff;--shadow:0 8px 40px rgba(0,0,0,0.3);--shadow-lg:0 24px 60px rgba(0,0,0,0.4);--focus-color:#5aabff;--focus-ring:0 0 0 3px rgba(90,171,255,0.45);--muted-strong:#a1a1a6}}
*{box-sizing:border-box;margin:0}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--text);font-family:var(--font-sans);font-size:15px;line-height:1.4706;-webkit-font-smoothing:antialiased;animation:fadeIn .5s var(--ease-out)}
@keyframes fadeIn{from{opacity:0}}
@keyframes slideUp{from{opacity:0;transform:translateY(12px)}}
@keyframes spin{to{transform:rotate(360deg)}}
.card{width:min(400px,calc(100vw - 32px));background:var(--surface);-webkit-backdrop-filter:blur(40px) saturate(180%);backdrop-filter:blur(40px) saturate(180%);border:1px solid var(--surface-border);border-radius:var(--radius);padding:40px;box-shadow:var(--shadow-lg);animation:slideUp .6s var(--ease-out) .1s both}
.brand{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:600;letter-spacing:-0.01em;padding-bottom:20px;border-bottom:1px solid var(--line);margin-bottom:28px;color:var(--text)}
.brand .logo-mark{width:22px;height:22px;display:grid;grid-template-columns:repeat(2,1fr);gap:2px;padding:2px;flex-shrink:0;border-radius:5px;overflow:hidden}
.brand .logo-mark span{display:block;border-radius:1.5px}
.brand .logo-mark span:nth-child(1){background:#f25022}.brand .logo-mark span:nth-child(2){background:#7fba00}.brand .logo-mark span:nth-child(3){background:#00a4ef}.brand .logo-mark span:nth-child(4){background:#ffb900}
h1{font-size:22px;font-weight:700;letter-spacing:-0.02em;margin:0 0 6px;color:var(--text)}
p{color:var(--muted);font-size:14px;margin:0 0 24px;line-height:1.5}
.warning{padding:12px 14px;background:rgba(255,59,48,0.08);border:1px solid rgba(255,59,48,0.2);color:var(--red);margin-bottom:20px;font-size:13px;border-radius:var(--radius-sm);line-height:1.5}
.warning code{font-weight:600}
.field{margin:20px 0}
.field:first-of-type{margin-top:0}
label{display:block;font-weight:500;font-size:13px;margin-bottom:8px;color:var(--text)}
.password-wrap{position:relative}
.password-wrap input{padding-right:40px}
.password-toggle{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--muted);cursor:pointer;padding:4px 6px;margin:0;width:auto;font-size:15px;line-height:1;border-radius:6px;min-height:auto;transition:color .2s ease}
.password-toggle:hover{color:var(--text);background:transparent;box-shadow:none}
input{width:100%;padding:10px 14px;border:1.5px solid var(--line);border-radius:var(--radius-sm);font:inherit;font-size:15px;background:rgba(255,255,255,0.5);color:var(--text);outline:0;transition:border-color .2s ease,box-shadow .2s ease,background .2s ease}
@media(prefers-color-scheme:dark){input{background:rgba(0,0,0,0.2)}}
input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,113,227,0.15);background:rgba(255,255,255,0.7)}
@media(prefers-color-scheme:dark){input:focus{background:rgba(0,0,0,0.3);box-shadow:0 0 0 3px rgba(10,132,255,0.2)}}
input::placeholder{color:var(--muted)}
button{width:100%;border:0;background:var(--primary);color:var(--bg);padding:10px 16px;margin-top:20px;font:inherit;font-size:15px;font-weight:600;cursor:pointer;border-radius:var(--radius-sm);transition:background .2s ease,transform .15s var(--ease-out),box-shadow .2s ease;position:relative;overflow:hidden;min-height:44px}
button:hover{background:var(--primary-hover);box-shadow:var(--shadow)}
button:active{transform:scale(0.97)}
button:disabled{cursor:not-allowed;opacity:0.5;transform:none!important;box-shadow:none!important}
button.loading{color:transparent;pointer-events:none}
button.loading::after{content:"";position:absolute;inset:0;margin:auto;width:20px;height:20px;border:2.5px solid var(--bg);border-top-color:transparent;border-radius:50%;animation:spin .6s linear infinite}
.error{color:var(--red);font-size:13px;margin-top:12px;min-height:20px;transition:opacity .2s ease}
[hidden]{display:none!important}
#login,#change{animation:slideUp .5s var(--ease-out) .15s both}
.ico{width:18px;height:18px;flex-shrink:0;display:block;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
:focus{outline:none}
:focus-visible{outline:2px solid var(--focus-color);outline-offset:2px}
input:focus-visible{outline:none}
button:focus-visible{box-shadow:var(--focus-ring)}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important}.password-toggle{transition:none}}
</style></head>
<body>
<main class="card">
  <div class="brand"><span class="logo-mark"><span></span><span></span><span></span><span></span></span>M365 Copilot2API</div>
  <section id="login">
    <h1>管理员登录</h1>
    <p>请输入管理员密码以进入控制台</p>
    <div class="warning">默认密码 <code>admin123</code><br>首次登录后请立即修改管理员密码</div>
    <form id="loginForm">
      <div class="field">
        <label for="password">管理员密码</label>
        <div class="password-wrap">
          <input id="password" type="password" autocomplete="current-password" required autofocus>
          <button type="button" class="password-toggle" onclick="togglePassword(this)" aria-label="显示密码" aria-pressed="false"><svg class="ico ico-eye" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/> <circle cx="12" cy="12" r="3"/></svg></button>
        </div>
      </div>
      <button id="loginBtn">登录</button>
    </form>
    <div class="error" id="loginError" role="alert" aria-live="assertive"></div>
  </section>
  <section id="change" hidden>
    <h1>必须立即修改默认密码</h1>
    <div class="warning">当前仍在使用初始密码。为了保护账号池、OAuth 凭据与 API Key，在设置新密码前不能使用任何管理功能。</div>
    <form id="changeForm">
      <div class="field">
        <label for="current">当前密码</label>
        <div class="password-wrap">
          <input id="current" type="password" autocomplete="current-password" required>
          <button type="button" class="password-toggle" onclick="togglePassword(this)" aria-label="显示密码" aria-pressed="false"><svg class="ico ico-eye" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/> <circle cx="12" cy="12" r="3"/></svg></button>
        </div>
      </div>
      <div class="field">
        <label for="next">新密码（至少 6 个字符）</label>
        <div class="password-wrap">
          <input id="next" type="password" autocomplete="new-password" minlength="6" required>
          <button type="button" class="password-toggle" onclick="togglePassword(this)" aria-label="显示密码" aria-pressed="false"><svg class="ico ico-eye" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/> <circle cx="12" cy="12" r="3"/></svg></button>
        </div>
      </div>
      <div class="field">
        <label for="confirm">再次输入新密码</label>
        <div class="password-wrap">
          <input id="confirm" type="password" autocomplete="new-password" minlength="6" required>
          <button type="button" class="password-toggle" onclick="togglePassword(this)" aria-label="显示密码" aria-pressed="false"><svg class="ico ico-eye" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/> <circle cx="12" cy="12" r="3"/></svg></button>
        </div>
      </div>
      <button id="changeBtn">修改密码并重新登录</button>
    </form>
    <div class="error" id="changeError" role="alert" aria-live="assertive"></div>
  </section>
</main>
<script>
const $=id=>document.getElementById(id);
const EYE="<svg class=\"ico ico-eye\" viewBox=\"0 0 24 24\" aria-hidden=\"true\" focusable=\"false\"><path d=\"M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0\"/> <circle cx=\"12\" cy=\"12\" r=\"3\"/></svg>";
const EYE_OFF="<svg class=\"ico ico-eye\" viewBox=\"0 0 24 24\" aria-hidden=\"true\" focusable=\"false\"><path d=\"M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49\"/> <path d=\"M14.084 14.158a3 3 0 0 1-4.242-4.242\"/> <path d=\"M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143\"/> <path d=\"m2 2 20 20\"/></svg>";
// 切换可见性：直接换内联 SVG，并同步 aria-label / aria-pressed，
// 让读屏用户也知道当前密码是明文还是掩码。
function togglePassword(btn){
  const inp=btn.previousElementSibling;
  const isPassword=inp.type==='password';
  inp.type=isPassword?'text':'password';
  btn.innerHTML=isPassword?EYE_OFF:EYE;
  btn.setAttribute('aria-label',isPassword?'隐藏密码':'显示密码');
  btn.setAttribute('aria-pressed',isPassword?'true':'false');
  inp.focus();
}
function setLoading(btn,loading){if(loading){btn.disabled=true;btn.classList.add('loading')}else{btn.disabled=false;btn.classList.remove('loading')}}
async function request(url,body){const r=await fetch(url,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const raw=await r.text();let d={};try{d=JSON.parse(raw)}catch{}if(!r.ok){const e=new Error(d?.error?.message||raw||'请求失败');e.status=r.status;throw e}return d}
function requireChange(current=''){$('login').hidden=true;$('change').hidden=false;if(current){$('current').value=current;}$('next').focus()}
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();$('loginError').textContent='';const password=$('password').value;if(!password)return;setLoading($('loginBtn'),true);try{const d=await request('/api/admin/login',{password});if(d.must_change_password)requireChange(password);else location.replace('/')}catch(x){$('loginError').textContent=x.status===429?'失败次数过多，请稍后再试':x.message}finally{setLoading($('loginBtn'),false)}});
$('changeForm').addEventListener('submit',async e=>{e.preventDefault();$('changeError').textContent='';if($('next').value!==$('confirm').value){$('changeError').textContent='两次输入的新密码不一致';return}if($('next').value.length<6){$('changeError').textContent='新密码至少需要 6 个字符';return}setLoading($('changeBtn'),true);try{await request('/api/admin/change-password',{current_password:$('current').value,new_password:$('next').value});alert('密码修改成功。所有旧会话已失效，请使用新密码重新登录。');location.replace('/')}catch(x){$('changeError').textContent=x.message}finally{setLoading($('changeBtn'),false)}});
fetch('/api/admin/session',{credentials:'same-origin'}).then(r=>r.json()).then(d=>{if(d.authenticated&&d.must_change_password){$('login').hidden=true;$('change').hidden=false;$('next').focus()}else if(d.authenticated)location.replace('/')}).catch(()=>{});
</script>
</body>
</html>
