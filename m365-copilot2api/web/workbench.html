<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>聊天工作台</title>
<link rel="icon" href="/favicon.ico">
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
  font-size: 14px;
  color: #1f2328;
  background: #f6f7f9;
  height: 100vh;
  display: flex;
  flex-direction: column;
}
header {
  padding: 10px 14px;
  background: #fff;
  border-bottom: 1px solid #d8dbe0;
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
}
header h1 { font-size: 15px; margin: 0 8px 0 0; font-weight: 600; }
label { color: #57606a; }
select, input[type="password"], textarea, button {
  font-family: inherit;
  font-size: 14px;
  border: 1px solid #d8dbe0;
  border-radius: 4px;
  padding: 5px 8px;
  background: #fff;
  color: inherit;
}
select { min-width: 190px; }
input[type="password"] { width: 210px; }
button { cursor: pointer; background: #f6f7f9; }
button:hover:enabled { background: #eceef1; }
button:disabled { cursor: not-allowed; opacity: .5; }
#send { background: #1f6feb; border-color: #1f6feb; color: #fff; }
#send:hover:enabled { background: #1a5fd0; }
#error {
  display: none;
  margin: 0;
  padding: 8px 14px;
  background: #fff1f0;
  border-bottom: 1px solid #f3c2bd;
  color: #a4231a;
  white-space: pre-wrap;
}
#log {
  flex: 1;
  overflow-y: auto;
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.msg { max-width: 76%; padding: 8px 11px; border-radius: 6px; line-height: 1.55; }
/* white-space: pre-wrap 保留模型输出里的换行与缩进，无需任何 HTML 转换 */
.msg .body { white-space: pre-wrap; word-break: break-word; }
.msg .who { font-size: 12px; color: #57606a; margin-bottom: 3px; }
.msg.user { align-self: flex-end; background: #ddeaff; border: 1px solid #c2d8fb; }
.msg.assistant { align-self: flex-start; background: #fff; border: 1px solid #d8dbe0; }
.msg.assistant.pending .body::after {
  content: "▍";
  color: #57606a;
}
.empty { color: #8b949e; align-self: center; margin-top: 30px; }
footer {
  border-top: 1px solid #d8dbe0;
  background: #fff;
  padding: 10px 14px;
  display: flex;
  gap: 8px;
  align-items: flex-end;
}
textarea {
  flex: 1;
  resize: vertical;
  min-height: 62px;
  max-height: 220px;
  line-height: 1.5;
}
.hint { color: #8b949e; font-size: 12px; padding: 0 14px 8px; background: #fff; }
</style>
</head>
<body>
<header>
  <h1>聊天工作台</h1>
  <label for="model">模型</label>
  <select id="model"><option value="">加载中…</option></select>
  <label for="apikey">API Key</label>
  <input id="apikey" type="password" placeholder="留空则不带鉴权头" autocomplete="off" spellcheck="false">
  <button id="clear" type="button">清空对话</button>
</header>
<p id="error" role="alert"></p>
<main id="log"><div class="empty">还没有消息，输入内容开始对话。</div></main>
<footer>
  <textarea id="input" placeholder="输入消息，Enter 发送，Shift+Enter 换行"></textarea>
  <button id="send" type="button">发送</button>
  <button id="stop" type="button" disabled>停止</button>
</footer>
<div class="hint">仅聊天用途：POST /v1/chat/completions（流式）。API Key 保存在本机 localStorage。</div>
<script>
'use strict';
(function () {
  var KEY_STORE = 'm365_workbench_api_key';
  var modelSel = document.getElementById('model');
  var keyInput = document.getElementById('apikey');
  var logEl = document.getElementById('log');
  var errEl = document.getElementById('error');
  var inputEl = document.getElementById('input');
  var sendBtn = document.getElementById('send');
  var stopBtn = document.getElementById('stop');
  var clearBtn = document.getElementById('clear');

  var history = [];      // [{role, content}]，仅聊天上下文
  var controller = null; // 当前流的 AbortController
  var generation = 0;    // 清空对话时自增，作废在途响应

  try {
    var saved = localStorage.getItem(KEY_STORE);
    if (saved) { keyInput.value = saved; }
  } catch (e) { /* 隐私模式下 localStorage 不可用，忽略 */ }
  keyInput.addEventListener('change', function () {
    try { localStorage.setItem(KEY_STORE, keyInput.value.trim()); } catch (e) { /* 同上 */ }
  });

  function showError(text) {
    errEl.textContent = text;         // textContent：错误文案也不走 HTML 解析
    errEl.style.display = 'block';
  }
  function clearError() {
    errEl.textContent = '';
    errEl.style.display = 'none';
  }

  function authHeaders() {
    var h = { 'Content-Type': 'application/json' };
    var key = keyInput.value.trim();   // 只进请求头，绝不进 URL 或 console
    if (key) { h['Authorization'] = 'Bearer ' + key; }
    return h;
  }

  // 所有气泡文本一律经 textContent 写入，不做任何 innerHTML 拼接。
  function addBubble(role, text) {
    var empty = logEl.querySelector('.empty');
    if (empty) { empty.remove(); }
    var wrap = document.createElement('div');
    wrap.className = 'msg ' + role;
    var who = document.createElement('div');
    who.className = 'who';
    who.textContent = role === 'user' ? '你' : '助手';
    var body = document.createElement('div');
    body.className = 'body';
    body.textContent = text || '';
    wrap.appendChild(who);
    wrap.appendChild(body);
    logEl.appendChild(wrap);
    scrollDown();
    return { wrap: wrap, body: body };
  }
  function scrollDown() { logEl.scrollTop = logEl.scrollHeight; }

  function loadModels() {
    fetch('/v1/models', { headers: authHeaders() }).then(function (res) {
      if (!res.ok) { throw new Error('HTTP ' + res.status + ' ' + res.statusText); }
      return res.json();
    }).then(function (data) {
      var list = (data && (data.data || data.models)) || [];
      modelSel.textContent = '';
      if (!list.length) {
        var none = document.createElement('option');
        none.value = '';
        none.textContent = '（无可用模型）';
        modelSel.appendChild(none);
        return;
      }
      list.forEach(function (m) {
        var id = typeof m === 'string' ? m : (m && (m.id || m.slug));
        if (!id) { return; }
        var opt = document.createElement('option');
        opt.value = id;
        // display_name 来自服务端，同样只用 textContent 落地
        opt.textContent = (typeof m === 'object' && m.display_name && m.display_name !== id)
          ? (m.display_name + '（' + id + '）') : id;
        modelSel.appendChild(opt);
      });
    }).catch(function (err) {
      modelSel.textContent = '';
      var opt = document.createElement('option');
      opt.value = '';
      opt.textContent = '（模型列表加载失败）';
      modelSel.appendChild(opt);
      showError('加载模型列表失败：' + (err && err.message ? err.message : '未知错误'));
    });
  }

  function setBusy(busy) {
    sendBtn.disabled = busy;
    stopBtn.disabled = !busy;
    modelSel.disabled = busy;
  }

  function send() {
    var text = inputEl.value.replace(/\s+$/, '');
    if (!text || controller) { return; }
    var model = modelSel.value;
    if (!model) { showError('请先选择模型。'); return; }
    clearError();

    inputEl.value = '';
    history.push({ role: 'user', content: text });
    addBubble('user', text);
    var bubble = addBubble('assistant', '');
    bubble.wrap.classList.add('pending');

    var mine = generation;
    var acc = '';
    var parseErrors = 0;
    controller = new AbortController();
    setBusy(true);

    fetch('/v1/chat/completions', {
      method: 'POST',
      headers: authHeaders(),
      signal: controller.signal,
      body: JSON.stringify({ model: model, stream: true, messages: history.slice() })
    }).then(function (res) {
      if (!res.ok) {
        return res.text().then(function (body) {
          var reason = (body || '').slice(0, 300).replace(/\s+/g, ' ').trim();
          throw new Error('HTTP ' + res.status + (reason ? '：' + reason : ' ' + res.statusText));
        });
      }
      if (!res.body) { throw new Error('当前浏览器不支持流式读取'); }

      var reader = res.body.getReader();
      var decoder = new TextDecoder('utf-8');
      var buf = '';

      function handleFrame(payload) {
        if (payload === '[DONE]') { return true; }
        var obj;
        try {
          obj = JSON.parse(payload);
        } catch (e) {
          parseErrors++;   // SSE 帧解析失败只计数，不打断已渲染内容
          return false;
        }
        if (obj && obj.error) {
          var msg = obj.error.message || obj.error.code || '上游返回错误';
          showError('上游错误：' + msg);
          return false;
        }
        var choices = obj && obj.choices;
        if (!choices || !choices.length) { return false; }
        var delta = choices[0].delta || {};
        // 只渲染正文；reasoning/tool_calls 按范围要求不展示
        if (typeof delta.content === 'string' && delta.content) {
          acc += delta.content;
          bubble.body.textContent = acc;   // 增量渲染，仍走 textContent
          scrollDown();
        }
        return false;
      }

      function pump() {
        return reader.read().then(function (chunk) {
          if (chunk.done) { return; }
          buf += decoder.decode(chunk.value, { stream: true });
          var idx;
          // SSE 以空行分隔事件；兼容 \n\n 与 \r\n\r\n
          while ((idx = buf.search(/\r?\n\r?\n/)) !== -1) {
            var raw = buf.slice(0, idx);
            buf = buf.slice(idx + buf.match(/\r?\n\r?\n/)[0].length);
            var done = false;
            raw.split(/\r?\n/).forEach(function (line) {
              if (line.indexOf('data:') !== 0) { return; }   // 跳过注释心跳等
              if (handleFrame(line.slice(5).trim())) { done = true; }
            });
            if (done) { return; }
          }
          return pump();
        });
      }
      return pump();
    }).then(function () {
      if (mine !== generation) { return; }
      if (parseErrors) { showError('有 ' + parseErrors + ' 个 SSE 数据帧解析失败，回复可能不完整。'); }
      if (acc) {
        history.push({ role: 'assistant', content: acc });
      } else {
        bubble.body.textContent = '（无内容返回）';
      }
    }).catch(function (err) {
      if (mine !== generation) { return; }
      if (err && err.name === 'AbortError') {
        // 已收到的片段保留为上下文，标注中断
        if (acc) { history.push({ role: 'assistant', content: acc }); }
        bubble.body.textContent = acc + (acc ? '\n' : '') + '（已停止）';
        return;
      }
      showError('请求失败：' + (err && err.message ? err.message : '未知错误'));
      if (!acc) { bubble.wrap.remove(); }
      history.pop();   // 请求未成立，撤回刚入队的用户消息
    }).then(function () {
      controller = null;
      setBusy(false);
      bubble.wrap.classList.remove('pending');
      inputEl.focus();
    });
  }

  sendBtn.addEventListener('click', send);
  stopBtn.addEventListener('click', function () {
    if (controller) { controller.abort(); }
  });
  clearBtn.addEventListener('click', function () {
    generation++;                       // 作废在途响应的收尾逻辑
    if (controller) { controller.abort(); }
    controller = null;
    setBusy(false);
    history = [];
    logEl.textContent = '';
    var tip = document.createElement('div');
    tip.className = 'empty';
    tip.textContent = '还没有消息，输入内容开始对话。';
    logEl.appendChild(tip);
    clearError();
    inputEl.focus();
  });
  inputEl.addEventListener('keydown', function (ev) {
    // Enter 发送、Shift+Enter 换行；输入法组合期间不拦截
    if (ev.key === 'Enter' && !ev.shiftKey && !ev.isComposing) {
      ev.preventDefault();
      send();
    }
  });

  loadModels();
  inputEl.focus();
})();
</script>
</body>
</html>
