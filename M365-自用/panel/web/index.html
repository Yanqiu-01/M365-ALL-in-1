<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>M365 面板</title>
<style>
  :root{--bg:#0f1420;--panel:#171e2e;--panel2:#1d2740;--line:#2a3650;--fg:#e6ecf5;--mut:#93a1bd;--acc:#4f8cff;--ok:#34d399;--warn:#fbbf24;--bad:#f87171}
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif;background:var(--bg);color:var(--fg)}
  header{padding:14px 24px;display:flex;align-items:baseline;gap:12px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#141b2c,#0f1420)}
  header h1{font-size:18px;margin:0}
  header .sub{color:var(--mut);font-size:12px}
  main{max-width:1120px;margin:0 auto;padding:20px 24px 60px}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
  .card h3{margin:0 0 8px;font-size:14px;color:var(--mut);font-weight:600}
  .big{font-size:30px;font-weight:700}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
  @media(max-width:760px){.grid2{grid-template-columns:1fr}}
  section{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:14px}
  section h2{font-size:15px;margin:0 0 10px}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
  label{color:var(--mut);font-size:13px}
  select,input[type=number],input[type=text]{background:var(--panel2);border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:7px 10px;font-size:13px}
  .btn{background:var(--acc);border:none;color:#fff;border-radius:8px;padding:8px 16px;font-size:13px;cursor:pointer;font-weight:600}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .btn.gray{background:#33415e}
  .btn.bad{background:#b91c1c}
  pre.log{background:#0b0f1a;border:1px solid var(--line);border-radius:8px;padding:10px;max-height:320px;overflow:auto;font:12px/1.5 "Cascadia Code","Consolas",monospace;white-space:pre-wrap;word-break:break-all;color:#c9d7f0}
  .ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}
  .mut{color:var(--mut)}
  .progress{height:8px;background:var(--panel2);border-radius:6px;overflow:hidden;margin-top:8px}
  .progress i{display:block;height:100%;background:var(--acc);width:0%;transition:width .4s}
  .hint{font-size:12px;color:var(--mut)}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
  th{color:var(--mut);font-weight:600;position:sticky;top:0;background:var(--panel)}
  .pill{display:inline-block;border-radius:20px;padding:2px 9px;font-size:12px;font-weight:600}
  .pill.on{background:#0d2b22;color:var(--ok)}
  .pill.fail{background:#3b1116;color:var(--bad)}
  .pill.mut{background:#232b3d;color:var(--mut)}
  .twocol{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:860px){.twocol{grid-template-columns:1fr}}
  footer{color:var(--mut);font-size:12px;padding:18px 24px;text-align:center}
</style>
</head>
<body>
<header><h1>M365 面板</h1><span class="sub">注册 · 授权导入 · 状态</span></header>
<main>
  <div class="cards">
    <div class="card"><h3>账密文件账号</h3><div class="big" id="credTotal">-</div></div>
    <div class="card"><h3>网关在线</h3><div class="big" id="gwOnline" data-err="0">-</div><div class="hint" id="gwHint"></div></div>
    <div class="card"><h3>本地授权记录</h3><div class="big" id="oauthDone">-</div>
      <div class="hint">失败 <span id="oauthFailCount">-</span> · 仅本机日志,账号是否可用以网关为准</div></div>
    <div class="card"><h3>任务</h3><div class="big" id="jobState">空闲</div><div class="hint" id="jobKind"></div>
      <div class="progress"><i id="jobProg"></i></div>
      <p class="hint" id="jobStart"></p></div>
  </div>

  <div class="twocol">
    <section>
      <h2>注册新账号</h2>
      <div class="row">
        <label>出口方式</label>
        <select id="regMode">
          <option value="phone">手机 LTE (v3)</option>
          <option value="clash">Clash 机场 (v2)</option>
          <option value="proxy">DE 代理池 (v1)</option>
        </select>
        <label>数量</label>
        <input id="regCount" type="number" min="1" max="20" value="1">
        <button class="btn" id="regBtn" onclick="startRegister()">开始注册</button>
      </div>
      <p class="hint">每 IP 24h 仅成功 1 次。成功后账号写入 <b>桌面\IP出口\M365账密.txt</b>。</p>
    </section>

    <section>
      <h2>OAuth 授权导入</h2>
      <p class="hint">对单个已注册账号执行浏览器授权,写入当前网关 (127.0.0.1:4141) 账号池。</p>
      <div class="row">
        <input id="oauthEmail" type="text" placeholder="账密文件里的邮箱地址" style="min-width:280px;flex:1">
        <button class="btn" id="oauthBtn" onclick="startOauth()">授权导入</button>
      </div>
      <details>
        <summary class="hint mut" style="cursor:pointer;margin-top:6px">全部补授权(批量)</summary>
        <div class="row" style="margin-top:6px">
          <button class="btn gray" onclick="startOauthBatch()">对未授权账号批量 OAuth</button>
        </div>
      </details>
    </section>
  </div>

  <section>
    <h2>运行日志</h2>
    <div class="row"><button class="btn gray" id="stopBtn" onclick="stopJob()">停止任务</button></div>
    <pre class="log" id="jobLog"></pre>
  </section>

  <div class="twocol">
    <section><h2>网关在线账号</h2><div id="gwList" class="mut">–</div></section>
    <section><h2>OAuth 进度 / 失败</h2><div id="oauthList" class="mut">–</div></section>
  </div>
</main>
<footer>M365 本地控制面板 · 所有凭据仅本机处理</footer>

<script>
let currentLogCount = 0;
async function api(path, body){
  const r = await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body||{})});
  return r.json().catch(()=>({}));
}
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function pill(s){
  if(s==='online'||s==='success'||s==='ok'||s==='authenticated') return `<span class="pill on">${s}</span>`;
  if(s.includes('fail')||s.includes('err')||s.includes('exc')||s==='timeout'||s.includes('captcha')||s.includes('locked')) return `<span class="pill fail">${s}</span>`;
  return `<span class="pill mut">${s}</span>`;
}
async function startRegister(){
  setBusy('regBtn',true);
  const r = await api('/api/register',{mode:document.getElementById('regMode').value,count:document.getElementById('regCount').value});
  if(!r.ok){alert(r.error||'启动失败');}
  setBusy('regBtn',false); poll();
}
async function startOauth(){
  const email=document.getElementById('oauthEmail').value.trim();
  if(!email){alert('请输入邮箱');return;}
  setBusy('oauthBtn',true);
  const r = await api('/api/oauth',{email});
  if(!r.ok){alert(r.error||'启动失败');}
  setBusy('oauthBtn',false); poll();
}
async function startOauthBatch(){
  const r = await fetch('/api/oauth/batch',{method:'POST'});
  const j = await r.json();
  if(!j.ok) alert(j.error||'启动失败');
  poll();
}
async function stopJob(){ await api('/api/job/stop'); poll(); }
function setBusy(id,on){const el=document.getElementById(id);if(el)el.disabled=on;}
async function poll(){
  // 先排空子进程 stdout, 让日志实时
  try { await fetch('/api/job/poll'); } catch(e){}
  const s = await (await fetch('/api/state')).json();
  document.getElementById('credTotal').textContent = s.cred_total;
  document.getElementById('gwOnline').textContent = s.gw_online;
  const gwh=document.getElementById('gwHint');
  gwh.textContent = s.gw_error || '';
  gwh.classList.toggle('bad', !!s.gw_error);
  document.getElementById('oauthDone').textContent = s.oauth_done.length;
  document.getElementById('oauthFailCount').textContent = s.oauth_fails.length;
  const js = document.getElementById('jobState');
  js.textContent = s.job.running ? '运行中' : '空闲';
  js.className = 'big ' + (s.job.running?'ok':'mut');
  document.getElementById('jobKind').textContent = s.job.kind || '';
  document.getElementById('jobStart').textContent = s.job.started?('开始 '+new Date(s.job.started*1000).toLocaleTimeString()):'';
  // 网关列表
  const gwl=document.getElementById('gwList');
  if(s.gw_emails.length){
    gwl.innerHTML = s.gw_emails.map(e=>`<div>${esc(e)}</div>`).join('');
  } else gwl.textContent = s.gw_error || '–';
  // oauth 列表合并
  const mapa={};
  s.oauth_done.forEach(r=>mapa[r.email]=['online',r]);
  s.oauth_fails.forEach(r=>{if(!mapa[r.email])mapa[r.email]=['fail',r];});
  const olist=document.getElementById('oauthList');
  const emails=Object.keys(mapa).sort();
  olist.innerHTML = emails.length?emails.map(e=>`<div>${esc(e)} ${pill(mapa[e][0])}</div>`).join(''):'–';
  // job log 增量
  const log=document.getElementById('jobLog');
  if(s.job.log.length!==currentLogCount){
    log.textContent = s.job.log.join('\n');
    currentLogCount = s.job.log.length;
    log.scrollTop = log.scrollHeight;
  }
}
setInterval(poll, 2500);
poll();
</script>
</body>
</html>
